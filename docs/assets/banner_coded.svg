<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bannerBg)" rx="16" />
  <rect width="1200" height="420" fill="url(#gridPattern)" rx="16" />
  <rect width="1200" height="420" fill="url(#centerGlow)" rx="16" />
  <rect width="1200" height="420" fill="none" stroke="#1e293b" stroke-width="1.5" rx="16" />

  <!-- Center Decorative Waves / Network Orbit -->
  <circle cx="600" cy="120" r="140" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="600" cy="120" r="95" fill="none" stroke="#2563eb" stroke-width="1" stroke-opacity="0.25" />

  <!-- App Brand Icon (Exact App Icon: Wi-Fi Waves) -->
  <g transform="translate(560, 80)">
    <rect width="80" height="80" rx="20" fill="url(#accentGrad)" filter="url(#softGlow)" />
    <g transform="translate(16, 16) scale(2)" stroke="#ffffff" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12.55a11 11 0 0 1 14.08 0" />
      <path d="M1.42 9a16 16 0 0 1 21.16 0" />
      <path d="M8.59 16.11a6 6 0 0 1 6.82 0" />
    </g>
  </g>

  <!-- Project Name -->
  <text x="600" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-1">
    LAN Share
  </text>

  <!-- Official Tagline from App Header -->
  <text x="600" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="16" font-weight="600" fill="#60a5fa" text-anchor="middle" letter-spacing="3">
    FAST · LOCAL · SECURE
  </text>

  <!-- Concise Accurate Value Proposition -->
  <text x="600" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Zero-Install Browser-to-Browser File Transfer &amp; Encrypted Messaging over Local Wi-Fi
  </text>

  <!-- Authentic Feature Badges Row -->
  <g transform="translate(180, 325)">
    <!-- Badge 1: WebRTC Direct -->
    <g transform="translate(0, 0)">
      <rect width="150" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="75" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ WebRTC P2P</text>
    </g>

    <!-- Badge 2: Local Wi-Fi Speed -->
    <g transform="translate(165, 0)">
      <rect width="165" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="82.5" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🚀 Full LAN Speeds</text>
    </g>

    <!-- Badge 3: Zero Cloud Storage -->
    <g transform="translate(345, 0)">
      <rect width="165" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="82.5" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔒 Zero Cloud Storage</text>
    </g>

    <!-- Badge 4: Direct-to-Disk Stream -->
    <g transform="translate(525, 0)">
      <rect width="160" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="80" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">💾 Direct-to-Disk</text>
    </g>

    <!-- Badge 5: SHA-256 Verified -->
    <g transform="translate(700, 0)">
      <rect width="140" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="70" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">🛡️ SHA-256 Verified</text>
    </g>
  </g>
</svg>

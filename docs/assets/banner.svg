<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Obsidian Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="50%" stop-color="#0A1124" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>

    <!-- Central Ambient Radar Glow -->
    <radialGradient id="centerGlow" cx="600" cy="145" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#1D4ED8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050914" stop-opacity="0" />
    </radialGradient>

    <!-- Secondary Bottom Glow -->
    <radialGradient id="bottomGlow" cx="600" cy="380" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#050914" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Squircle Gradient -->
    <linearGradient id="logoGrad" x1="560" y1="88" x2="640" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Data Stream Line Gradients -->
    <linearGradient id="streamLeft" x1="250" y1="128" x2="530" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="streamRight" x1="670" y1="128" x2="950" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Title Metallic Gradient -->
    <linearGradient id="titleGrad" x1="600" y1="205" x2="600" y2="248" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Card Surface Gradient -->
    <linearGradient id="cardSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111C35" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#0B1325" stop-opacity="0.78" />
    </linearGradient>

    <!-- Architectural Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45" />
    </pattern>

    <!-- Radial Mask for Grid Fade -->
    <radialGradient id="gridMaskGrad" cx="600" cy="200" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="420" fill="url(#gridMaskGrad)" />
    </mask>

    <!-- Generous Drop Shadow Filter (No Clipping Box) -->
    <filter id="squircleShadow" x="480" y="20" width="240" height="240" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2563EB" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Base Canvas & Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" mask="url(#gridMask)" />
  <rect width="1200" height="420" rx="16" fill="url(#centerGlow)" />
  <rect width="1200" height="420" rx="16" fill="url(#bottomGlow)" />

  <!-- Outer Frame Border -->
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="15.25" stroke="#334155" stroke-opacity="0.45" stroke-width="1.5" />

  <!-- 2. Subnet Radar Rings (Centered at 600, 128) -->
  <circle cx="600" cy="128" r="142" stroke="#3B82F6" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 6" />
  <circle cx="600" cy="128" r="106" stroke="#3B82F6" stroke-opacity="0.22" stroke-width="1.2" />
  <circle cx="600" cy="128" r="72" stroke="#60A5FA" stroke-opacity="0.30" stroke-width="1.2" />

  <!-- 3. Left & Right P2P Stream Connectors + Telemetry Nodes -->
  <!-- Left Data Stream (Sender -> Radar) -->
  <line x1="278" y1="128" x2="494" y2="128" stroke="url(#streamLeft)" stroke-width="2" stroke-dasharray="6 5" />
  <circle cx="386" cy="128" r="3" fill="#60A5FA" />
  <circle cx="458" cy="128" r="3.5" fill="#38BDF8" />

  <!-- Left Node Card: Desktop Sender -->
  <g transform="translate(88, 92)">
    <rect width="190" height="72" rx="12" fill="url(#cardSurface)" stroke="#1E3A5F" stroke-opacity="0.7" stroke-width="1" />
    <!-- Laptop Icon Box -->
    <rect x="14" y="16" width="40" height="40" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <rect x="22" y="24" width="24" height="16" rx="2" stroke="#60A5FA" stroke-width="1.8" />
    <path d="M19 43H49" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" />
    <!-- Node Text -->
    <text x="66" y="31" fill="#F8FAFC" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Desktop Peer</text>
    <text x="66" y="47" fill="#94A3B8" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500">Direct-to-Disk Stream</text>
    <!-- Live LAN Speed Badge -->
    <circle cx="70" cy="59" r="3" fill="#10B981" />
    <text x="78" y="62.5" fill="#34D399" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.04em">LOCAL WI-FI · 68 MB/s</text>
  </g>

  <!-- Right Data Stream (Radar -> Receiver) -->
  <line x1="706" y1="128" x2="922" y2="128" stroke="url(#streamRight)" stroke-width="2" stroke-dasharray="6 5" />
  <circle cx="742" cy="128" r="3.5" fill="#38BDF8" />
  <circle cx="814" cy="128" r="3" fill="#60A5FA" />

  <!-- Right Node Card: Mobile Receiver -->
  <g transform="translate(922, 92)">
    <rect width="190" height="72" rx="12" fill="url(#cardSurface)" stroke="#1E3A5F" stroke-opacity="0.7" stroke-width="1" />
    <!-- Mobile Phone Icon Box -->
    <rect x="14" y="16" width="40" height="40" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <rect x="27" y="22" width="14" height="26" rx="2.5" stroke="#38BDF8" stroke-width="1.8" />
    <circle cx="34" cy="44" r="1" fill="#38BDF8" />
    <!-- Node Text -->
    <text x="66" y="31" fill="#F8FAFC" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Mobile Peer</text>
    <text x="66" y="47" fill="#94A3B8" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500">Multi-GB OPFS Sink</text>
    <!-- Verified Status Badge -->
    <circle cx="70" cy="59" r="3" fill="#38BDF8" />
    <text x="78" y="62.5" fill="#7DD3FC" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.04em">SHA-256 VERIFIED</text>
  </g>

  <!-- 4. Center Brand Squircle (84x84 at x=558, y=86) -->
  <g filter="url(#squircleShadow)">
    <rect x="558" y="86" width="84" height="84" rx="21" fill="url(#logoGrad)" />
    <!-- Inner Top Specular Highlight -->
    <rect x="558.75" y="86.75" width="82.5" height="82.5" rx="20.25" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="1.5" />
  </g>

  <!-- Crisp 3-Arc Wi-Fi Symbol Matching icon-512.png Proportions (Zero Filter Clipping) -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <!-- Outer Arc -->
    <path d="M 573 121.5 A 36 36 0 0 1 627 121.5" stroke-width="5.5" />
    <!-- Middle Arc -->
    <path d="M 581.5 133 A 24 24 0 0 1 618.5 133" stroke-width="5.5" />
    <!-- Inner Arc -->
    <path d="M 590.5 144.5 A 13 13 0 0 1 609.5 144.5" stroke-width="5.5" />
  </g>

  <!-- 5. Typography Hierarchy -->
  <!-- Main Title -->
  <text x="600" y="232" text-anchor="middle" fill="url(#titleGrad)" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.025em">LAN Share</text>

  <!-- Tagline -->
  <text x="600" y="264" text-anchor="middle" fill="#60A5FA" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.32em">FAST · LOCAL · SECURE</text>

  <!-- Value Proposition Subtitle -->
  <text x="600" y="298" text-anchor="middle" fill="#94A3B8" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400">Zero-Install Browser-to-Browser P2P File Transfer &amp; Encrypted Chat over Local Wi-Fi</text>

  <!-- 6. Bottom Feature Pills (Pure Vector Icons - Centered from x=92 to x=1108) -->
  <!-- Pill 1: WebRTC P2P -->
  <g transform="translate(92, 336)">
    <rect width="190" height="40" rx="20" fill="#0D162B" stroke="#1E293B" stroke-width="1.2" />
    <path d="M35 12L27 21H34L33 28L41 19H34L35 12Z" fill="#F59E0B" />
    <text x="50" y="24.5" fill="#F1F5F9" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">WebRTC DataChannels</text>
  </g>

  <!-- Pill 2: Full LAN Speeds -->
  <g transform="translate(298, 336)">
    <rect width="190" height="40" rx="20" fill="#0D162B" stroke="#1E293B" stroke-width="1.2" />
    <path d="M26 24A8 8 0 1 1 42 24" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <path d="M34 21L38 16" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <circle cx="34" cy="21" r="2" fill="#38BDF8" />
    <text x="51" y="24.5" fill="#F1F5F9" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Full LAN Speeds</text>
  </g>

  <!-- Pill 3: Zero Cloud Storage -->
  <g transform="translate(504, 336)">
    <rect width="192" height="40" rx="20" fill="#0D162B" stroke="#1E293B" stroke-width="1.2" />
    <rect x="26" y="19" width="12" height="9" rx="2" stroke="#10B981" stroke-width="1.8" />
    <path d="M29 19V16A3 3 0 0 1 35 16V19" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" />
    <text x="47" y="24.5" fill="#F1F5F9" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">Zero Cloud Storage</text>
  </g>

  <!-- Pill 4: OPFS & Direct-to-Disk -->
  <g transform="translate(712, 336)">
    <rect width="190" height="40" rx="20" fill="#0D162B" stroke="#1E293B" stroke-width="1.2" />
    <rect x="24" y="14" width="15" height="12" rx="2" stroke="#818CF8" stroke-width="1.8" />
    <line x1="24" y1="21" x2="39" y2="21" stroke="#818CF8" stroke-width="1.5" />
    <circle cx="35.5" cy="23.5" r="1" fill="#818CF8" />
    <text x="48" y="24.5" fill="#F1F5F9" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">OPFS &amp; Direct-to-Disk</text>
  </g>

  <!-- Pill 5: SHA-256 Verified -->
  <g transform="translate(918, 336)">
    <rect width="190" height="40" rx="20" fill="#0D162B" stroke="#1E293B" stroke-width="1.2" />
    <path d="M33 12L26 15V20.5C26 24.8 29 28.5 33 29.5C37 28.5 40 24.8 40 20.5V15L33 12Z" stroke="#C084FC" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M30 20.5L32.2 22.7L36.5 18.5" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="24.5" fill="#F1F5F9" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">SHA-256 Verified</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#2563eb" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="680" fill="none" stroke="#1f2937" stroke-width="2" rx="16" />

  <!-- App Header -->
  <rect x="0" y="0" width="1200" height="72" fill="#111827" fill-opacity="0.8" />
  <line x1="0" y1="72" x2="1200" y2="72" stroke="#1f2937" stroke-width="1.5" />

  <!-- Logo & Title -->
  <circle cx="56" cy="36" r="18" fill="url(#primaryGrad)" filter="url(#glow)" />
  <text x="56" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">📡</text>
  <text x="88" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f3f4f6" letter-spacing="-0.5">LAN Share</text>
  <rect x="195" y="27" width="56" height="20" rx="10" fill="#1e293b" />
  <text x="223" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">v1.0</text>

  <!-- Header Right Controls -->
  <rect x="940" y="22" width="105" height="30" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
  <text x="992" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#9ca3af" text-anchor="middle">🎨 Theme: Ocean</text>
  <circle cx="1075" cy="37" r="15" fill="#1f2937" stroke="#374151" stroke-width="1" />
  <text x="1075" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">📱</text>
  <circle cx="1120" cy="37" r="15" fill="#1f2937" stroke="#374151" stroke-width="1" />
  <text x="1120" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">🔔</text>

  <!-- Radar Canvas Background -->
  <circle cx="600" cy="370" r="260" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="600" cy="370" r="190" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="600" cy="370" r="120" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="600" cy="370" r="50" fill="none" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Radar Crosshairs -->
  <line x1="600" y1="100" x2="600" y2="640" stroke="#1f2937" stroke-width="1" stroke-dasharray="2 4" />
  <line x1="330" y1="370" x2="870" y2="370" stroke="#1f2937" stroke-width="1" stroke-dasharray="2 4" />

  <!-- Radar Gradient Sweep -->
  <circle cx="600" cy="370" r="260" fill="url(#radarSweep)" />

  <!-- Center Node (This Device) -->
  <circle cx="600" cy="370" r="32" fill="#1e293b" stroke="#3b82f6" stroke-width="3" filter="url(#glow)" />
  <text x="600" y="377" font-family="system-ui, -apple-system, sans-serif" font-size="20" text-anchor="middle" fill="#ffffff">💻</text>
  <text x="600" y="422" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f9fafb" text-anchor="middle">MacBook Pro (You)</text>
  <text x="600" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#60a5fa" text-anchor="middle">192.168.1.104 • Ready</text>

  <!-- Peer Node 1 (Phone on LAN) -->
  <g transform="translate(740, 260)">
    <circle cx="0" cy="0" r="26" fill="#111827" stroke="#10b981" stroke-width="2.5" />
    <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="18" text-anchor="middle" fill="#ffffff">📱</text>
    <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f3f4f6" text-anchor="middle">iPhone 15 Pro</text>
    <rect x="-35" y="48" width="70" height="18" rx="9" fill="#064e3b" />
    <text x="0" y="61" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">Connected</text>
  </g>

  <!-- P2P Transfer Stream Line -->
  <path d="M 625 350 Q 680 300 715 275" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 6" />

  <!-- Active Transfer Card Overlay (Bottom Left) -->
  <g transform="translate(60, 480)">
    <rect width="360" height="140" rx="12" fill="#111827" fill-opacity="0.95" stroke="#1f2937" stroke-width="1.5" filter="url(#glow)" />
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f9fafb">📁 4K_Drone_Footage.mp4</text>
    <text x="20" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af">2.4 GB • Sending to iPhone 15 Pro</text>

    <!-- Progress Bar -->
    <rect x="20" y="70" width="320" height="8" rx="4" fill="#1f2937" />
    <rect x="20" y="70" width="224" height="8" rx="4" fill="url(#primaryGrad)" />

    <!-- Progress Stats -->
    <text x="20" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#60a5fa">70% (1.68 GB / 2.4 GB)</text>
    <text x="340" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#10b981" text-anchor="end">52.4 MB/s • 14s left</text>
    <text x="20" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">Streaming Direct P2P • SHA-256 Verifying</text>
  </g>

  <!-- P2P Direct LAN Badge (Top Banner) -->
  <g transform="translate(435, 96)">
    <rect width="330" height="32" rx="16" fill="#172554" stroke="#2563eb" stroke-width="1" />
    <circle cx="20" cy="16" r="6" fill="#10b981" />
    <text x="35" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#bfdbfe">Direct WebRTC LAN P2P • Zero Cloud Storage</text>
  </g>

  <!-- Developer Placeholder Notice at Bottom -->
  <rect x="0" y="640" width="1200" height="40" fill="#0f172a" fill-opacity="0.9" />
  <text x="600" y="665" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">
    📸 Screenshot Placeholder: Replace with your actual UI screenshot or animated GIF at docs/assets/preview.svg
  </text>
</svg>
